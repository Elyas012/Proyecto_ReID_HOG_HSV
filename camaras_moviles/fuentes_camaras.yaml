# Configuración de celulares usados únicamente como cámaras.
# Copia la URL o índice que corresponda y úsalo con --fuente.
fuentes:
  - id: camara_pc_usb
    tipo: webcam
    valor: 0
    ejemplo_uso: python principal.py --modo inferir --fuente 0

  - id: celular_ip_webcam
    tipo: http
    valor: http://192.168.1.20:8080/video
    ejemplo_uso: python principal.py --modo inferir --fuente http://192.168.1.20:8080/video

  - id: video_grabado
    tipo: archivo
    valor: experimentos/exp_01_persona_sola/video.mp4
    ejemplo_uso: python principal.py --modo inferir --fuente experimentos/exp_01_persona_sola/video.mp4
