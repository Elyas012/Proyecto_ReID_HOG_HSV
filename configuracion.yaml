proyecto:
  nombre: Proyecto_ReID_HOG_HSV_Documentacion_OK
  descripcion: Sistema PC Python para identificación facial y re-identificación en tiempo real.

# La PC ejecuta toda la IA. Los celulares solo entregan video por USB, IP Webcam, DroidCam, RTSP/HTTP o archivo.
ejecucion:
  dispositivo: cpu
  modo_app: escritorio_python
  mostrar_ventana: true
  guardar_salida: true

# 0 = automatico. En multicamara se reserva CPU para que Windows siga respondiendo.
rendimiento:
  reservar_nucleos: 1
  hilos_cpu: 0
  hilos_cpu_multicamara: 0

# Se activa solo con: python principal.py --modo inferir
# Si pasas --fuente, se conserva la inferencia de una sola camara/video.
multicamara:
  activo_sin_fuente_en_inferir: true
  max_camaras: 4
  ancho_proceso: 640
  ancho_celda: 640
  alto_celda: 360
  intervalo_inferencia_ms: 120
  tamano_yolo: 416

# Ajustes para cargar videos desde archivo. Evita ventanas gigantes y mejora fluidez.
video:
  ancho_proceso: 960
  ancho_vista: 960
  alto_vista: 540
  procesar_cada_n_frames: 2
  inferencia_async: true
  respetar_fps: true
  saltar_frames_atrasados: true
  max_salto_frames: 30
  fps_por_defecto: 15
  tamano_yolo: 416

panel_control:
  activo: true

visualizacion:
  # persona = caja grande unificada, ambas = persona + ROI rostro,
  # rostro = ROI rostro independiente si existe; si no, usa persona.
  modo_cajas: rostro

camaras:
  fuentes:
    - id: camara_01
      tipo: webcam
      valor: 0
      ubicacion: prueba_local
    # Ejemplo IP Webcam/DroidCam:
    # - id: camara_celular
    #   tipo: ip
    #   valor: http://192.168.1.20:8080/video
    #   ubicacion: pasillo_frontal

yolo:
  # Si este archivo no está, ultralytics intentará cargar/descargar yolov8n.pt.
  # Si YOLO no está disponible, el proyecto usa HOG de OpenCV como respaldo para no bloquear la ejecución.
  pesos: modelos/yolov8n.pt
  clase_persona: 0
  confianza: 0.40
  tamano_imagen: 640
  dispositivo: cpu

umbrales:
  score_rostro: 0.80
  margen_rostro: 0.05
  score_reid: 0.65
  nitidez_minima: 60.0
  tamano_minimo_rostro: 40

# Segundo intento antes de activar Re-ID: busca rostro con zoom en la parte superior
# de la persona detectada, util para videos de pasillos/camaras lejanas.
rostro_en_persona:
  usar_zoom_si_no_detecta: false
  factor_zoom: 2.5
  porcentaje_superior: 0.45
  tamano_minimo_zoom: 24

caracteristicas:
  descriptor_rostro: hog
  descriptor_reid: hsv
  tamano_rostro: [96, 96]
  tamano_torso: [128, 256]
  bins_hsv: [16, 16, 8]

# Re-ID se aprende durante la inferencia en vivo: cuando el rostro es reconocido
# por HoG + SVM facial, se guarda HSV del torso con esa identidad y se reentrena SVM Re-ID.
aprendizaje_reid_en_vivo:
  activo: true
  combinar_con_reid_fijo: true
  minimo_por_identidad: 4
  reentrenar_cada: 5
  modelo_salida: svm_reidentificacion_combinado.pkl
  usar_modelo_en_vivo: true
  max_muestras_vivas_por_identidad: 80
  score_rostro_min_aprendizaje: 0.90
  margen_rostro_min_aprendizaje: 0.20

rutas:
  datos: datos
  rostros: datos/rostros
  reidentificacion: datos/reidentificacion
  modelos: modelos
  salidas: salidas
  reportes: reportes
  registros: registros

entrenamiento:
  modelo: svm
  kernel: rbf
  # 0.20 = 80% entrenamiento / 20% validacion.
  # El split se hace por identidad para no dejar clases desbalanceadas.
  validacion: 0.20
  validacion_por_clase: true
  semilla: 42
  probabilidad: true
  # 0 usa todas las imagenes disponibles en cada carpeta/clase.
  max_muestras_por_clase: 0
  # true = omite imagenes donde no detecta ROI facial.
  # false = entrena tambien esas imagenes usando la imagen completa.
  # Solo afecta --modo entrenar.
  omitir_rostros_sin_roi: true
