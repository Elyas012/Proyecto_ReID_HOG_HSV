proyecto:
  nombre: Proyecto_ReID_HOG_HSV_Documentacion_OK
  descripcion: Sistema PC Python para identificación facial y re-identificación en tiempo real.

# La PC ejecuta toda la IA. Los celulares solo entregan video por USB, IP Webcam, DroidCam, RTSP/HTTP o archivo.
ejecucion:
  dispositivo: cpu
  modo_app: escritorio_python
  mostrar_ventana: true
  guardar_salida: true

# 0 = automatico. En multicamara se reserva CPU para que Windows siga respondiendo.
rendimiento:
  reservar_nucleos: 1
  hilos_cpu: 0
  # Para video conviene limitar hilos: evita que YOLO/OpenCV ocupen toda la CPU y congelen la UI.
  hilos_cpu_video: 4
  hilos_cpu_multicamara: 0

# Se activa solo con: python principal.py --modo inferir
# Si pasas --fuente, se conserva la inferencia de una sola camara/video.
multicamara:
  activo_sin_fuente_en_inferir: true
  max_camaras: 4
  ancho_proceso: 800
  ancho_celda: 640
  alto_celda: 360
  intervalo_inferencia_ms: 120
  tamano_yolo: 416

# Ajustes para cargar videos desde archivo.
video:
  respetar_resolucion_original: true
  vista_original_estricta: false
  pantalla_completa: true
  panel_separado: true
  alto_panel: 720
  ancho_proceso: 640
  ancho_vista: 1280
  alto_vista: 720
  # Cada cuantos frames se intenta analizar con IA. 1 = mas preciso, 3-5 = mas fluido.
  procesar_cada_n_frames: 3
  # true = el video no espera a la IA; usa el ultimo resultado disponible sin congelar.
  modo_fluido: true
  # 0 = no oculta cajas por desfase; recomendado para que los ROIs sigan visibles en video.
  max_desfase_roi_frames: 0
  respetar_fps: true
  # true = si el procesamiento se atrasa, salta frames del video para recuperar fluidez.
  saltar_frames_atrasados: true
  fps_por_defecto: 30
  tamano_yolo: 416

panel_control:
  activo: true

visualizacion:
  # persona = caja grande unificada, ambas = persona + ROI rostro,
  # rostro = ROI rostro independiente si existe; si no, usa persona.
  modo_cajas: rostro

camaras:
  fuentes:
    - id: camara_01
      tipo: webcam
      valor: 0
      ubicacion: prueba_local
    # Ejemplo IP Webcam/DroidCam:
    # - id: camara_celular
    #   tipo: ip
    #   valor: http://192.168.1.20:8080/video
    #   ubicacion: pasillo_frontal

yolo:
  # Si este archivo no está, ultralytics intentará cargar/descargar yolov8n.pt.
  # Si YOLO no está disponible, el proyecto usa HOG de OpenCV como respaldo para no bloquear la ejecución.
  pesos: modelos/yolov8n.pt
  clase_persona: 0
  confianza: 0.40
  tamano_imagen: 640
  dispositivo: cpu

umbrales:
  score_rostro: 0.70
  margen_rostro: 0.05
  score_reid: 0.30
  nitidez_minima: 10.0
  tamano_minimo_rostro: 20.0

# Segundo intento antes de activar Re-ID: busca rostro con zoom en la parte superior
# de la persona detectada, util para videos de pasillos/camaras lejanas.
rostro_en_persona:
  usar_zoom_si_no_detecta: true
  factor_zoom: 4.0
  porcentaje_superior: 0.45
  tamano_minimo_zoom: 18
  usar_roi_zoom_para_clasificar: true

caracteristicas:
  descriptor_rostro: hog
  # hsv_espacial = histograma HSV global + bandas horizontales del cuerpo completo/ropa.
  # Esto hace que Re-ID no mire solo "colores presentes", sino tambien donde estan en la persona.
  descriptor_reid: hsv_espacial
  tamano_rostro: [96, 96]
  hog_orientaciones: 9
  hog_pixeles_por_celda: [8, 8]
  hog_celdas_por_bloque: [2, 2]
  # Nombre historico: ahora representa el tamano normalizado del ROI Re-ID de persona completa.
  tamano_torso: [128, 256]
  bins_hsv: [16, 16, 8]
  reid_bandas_horizontales: 3
  reid_histograma_global: true
  reid_incluir_momentos: true
  reid_recorte_lateral: 0.08
  reid_recorte_superior: 0.0
  reid_recorte_inferior: 0.0

# Re-ID se aprende durante la inferencia en vivo: cuando el rostro es reconocido
# por HoG + SVM facial, se guarda HSV del cuerpo completo con esa identidad y se reentrena SVM Re-ID.
aprendizaje_reid_en_vivo:
  activo: true
  combinar_con_reid_fijo: true
  guardar_capturas: true
  carpeta_capturas: datos/reidentificacionF
  minimo_por_identidad: 4
  reentrenar_cada: 20
  # true = el reentrenamiento Re-ID no bloquea el video ni congela ROIs.
  reentrenar_async: true
  # Guarda el buffer cada N muestras vivas para reducir escritura a disco durante video.
  guardar_buffer_cada: 4
  reentrenar_combinado_al_iniciar: true
  modelo_salida: svm_reidentificacion_combinado.pkl
  usar_modelo_en_vivo: true
  max_muestras_vivas_por_identidad: 100
  max_imagenes_carpeta_por_identidad: 100
  score_rostro_min_aprendizaje: 0.85
  margen_rostro_min_aprendizaje: 0.20

augmentation_reidF:
  # Solo se aplica al entrenar modelos, usando las imagenes automaticas de datos/reidentificacionF.
  activo: true
  cantidad_por_imagen: 1
  guardar_imagenes: true
  # Se generan en la misma carpeta datos/reidentificacionF/<identidad>/ como *_aug_XX.jpg.
  max_imagenes_por_identidad: 100
  brillo: 18.0
  contraste: 0.12
  ruido_std: 3.0
  rotacion_grados: 3.0
  recorte_escala_min: 0.92
  espejo_horizontal: true

rutas:
  datos: datos
  rostros: datos/rostros
  rostros_v2: datos/rostros_v2
  reidentificacionF: datos/reidentificacionF
  modelos: modelos
  salidas: salidas
  reportes: reportes
  registros: registros

entrenamiento:
  modelo: svm
  # kernel queda como respaldo si no defines los especificos.
  kernel: rbf
  # Rostro HoG y Re-ID HSV pueden necesitar kernels distintos.
  kernel_rostro: linear
  kernel_reid: rbf
  # 0.20 = 80% entrenamiento / 20% validacion.
  # El split se hace por identidad para no dejar clases desbalanceadas.
  validacion: 0.20
  validacion_por_clase: true
  semilla: 42
  probabilidad: true
  # 0 usa todas las imagenes disponibles en cada carpeta/clase.
  max_muestras_por_clase: 0
  # Rango especifico para rostro. 0 hereda/usa todas.
  max_muestras_rostro_por_clase: 0
  # Rango especifico para Re-ID. Min 0 no filtra; max 0 usa todas.
  min_muestras_reid_por_clase: 0
  max_muestras_reid_por_clase: 0
  # true = omite imagenes donde no detecta ROI facial.
  # false = entrena tambien esas imagenes usando la imagen completa.
  # Solo afecta --modo entrenar.
  omitir_rostros_sin_roi: false
  # true = si detecta ROI facial pero es muy pequeno/borroso, no lo usa para entrenar rostro.
  filtrar_rostros_baja_calidad: false
